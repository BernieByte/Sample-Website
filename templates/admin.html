<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ByteNest | Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="admin-body">
  <main class="admin-page">
    <header class="admin-header">
      <div class="admin-heading">
        <a href="/" class="marketing-brand"><span class="marketing-brand-mark">b</span><span>ByteNest</span></a>
        <p class="admin-kicker">WORKSPACE ADMINISTRATION</p>
        <h1>Account overview</h1>
        <p class="admin-subtitle">A private view of registered members and recent sign-ins.</p>
      </div>
      <div class="admin-actions">
        <button id="refreshUsers" class="admin-button">Refresh</button>
        <button id="logoutAdmin" class="admin-button secondary">Log out</button>
      </div>
    </header>

    <section class="admin-summary">
      <span class="admin-summary-label">Registered users</span>
      <strong id="userCount">-</strong>
    </section>

    <section class="admin-table-wrap" aria-label="Registered users">
      <div class="admin-table-heading">
        <h2>All users</h2>
        <input id="userSearch" type="search" placeholder="Search users or emails" aria-label="Search users or emails">
      </div>
      <p id="adminMessage" class="admin-message" role="status"></p>
      <div class="admin-table-scroll">
        <table class="admin-table">
          <thead>
            <tr><th>ID</th><th>Username</th><th>Email</th><th>IP</th><th>Town</th><th>Country</th><th>State / Region</th><th>Source</th><th>Joined</th></tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-table-wrap" aria-label="Recent login activity">
      <div class="admin-table-heading">
        <h2>Recent login activity</h2>
      </div>
      <div class="admin-table-scroll">
        <table class="admin-table">
          <thead>
            <tr><th>Username</th><th>Email</th><th>IP</th><th>Town</th><th>Country</th><th>State / Region</th><th>Source</th><th>Logged in</th></tr>
          </thead>
          <tbody id="loginTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
