<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ByteNest | Reset password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="auth-help">Enter your account email and we will send a reset link.</p>
      <form id="forgotPasswordForm" class="auth-form">
        <label>Email<input id="resetEmail" type="email" required></label>
        <button type="submit">Send reset link</button>
      </form>
      <p id="forgotMessage" class="message" role="status"></p>
      <p class="auth-switch"><a href="/login">Back to log in</a></p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='password-reset.js') }}"></script>
</body>
</html>
