<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ByteNest | Choose a new password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Choose a new password</h1>
      <form id="resetPasswordForm" class="auth-form">
        <label>New password<input id="resetPassword" type="password" minlength="8" required></label>
        <label>Confirm password<input id="confirmPassword" type="password" minlength="8" required></label>
        <button type="submit">Reset password</button>
      </form>
      <p id="resetMessage" class="message" role="status"></p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='password-reset.js') }}"></script>
</body>
</html>
