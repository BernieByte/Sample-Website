<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6f8">
  <title>Choose a new password | ByteNest</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-story">
      <a href="/" class="auth-brand"><span class="marketing-brand-mark">b</span><span>ByteNest</span></a>
      <div class="auth-story-copy"><span class="auth-eyebrow">FRESH START</span><h1>A new password, then back to your ideas.</h1><p>Choose a password you haven't used here before.</p></div>
      <div class="auth-story-card"><span class="auth-card-mark">✳</span><p>Your reset link is private and works once.</p><span>YOUR BYTE NEST</span></div>
      <div class="auth-story-decoration decoration-one"></div><div class="auth-story-decoration decoration-two"></div>
    </section>
    <section class="auth-main">
      <div class="auth-panel">
        <a href="/" class="auth-mobile-brand"><span class="marketing-brand-mark">b</span> ByteNest</a>
        <div class="auth-panel-heading"><span class="auth-eyebrow">SECURE YOUR ACCOUNT</span><h2>Choose a new password</h2><p>Make it at least 8 characters long.</p></div>
        <form id="resetPasswordForm" class="auth-form modern-auth-form">
          <label for="resetPassword">New password<input id="resetPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label>
          <label for="confirmPassword">Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again" required></label>
          <button type="submit">Update password <span aria-hidden="true">→</span></button>
        </form>
        <p id="resetMessage" class="message" role="status"></p>
        <a href="/login" class="auth-back-link">← Back to log in</a>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='password-reset.js') }}"></script>
</body>
</html>
